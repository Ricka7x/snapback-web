name: Deploy Next.js App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect latest version and update constants
        run: |
          LATEST_FILE=$(ls releases/Snapback-*.dmg | sort -V | tail -n 1)
          LATEST_VERSION=$(basename "$LATEST_FILE" .dmg | sed 's/Snapback-//')
          echo "Detected latest version: $LATEST_VERSION"
          sed -i "s/LATEST_VERSION = \".*\"/LATEST_VERSION = \"$LATEST_VERSION\"/" web/src/lib/constants.ts

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Build Next.js app
        run: |
          cd web
          npm run build

      - name: Copy releases to export output
        run: cp -R releases web/out/releases

      - name: Copy CNAME to export output
        run: cp web/CNAME web/out/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/out
          publish_branch: gh-pages
          force_orphan: true
